name: Publish GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '*.html'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Download verified WebLLM resources (not committed to Git)
        run: npm run model:download
      - run: npm run model:download -- --verify
      - run: npm run runtime:download
      - run: npm run runtime:download -- --verify
      - run: npm run runtime:verify
      - run: npm run translator:download
      - run: npm run translator:download -- --verify
      - name: Read model delivery mode
        id: delivery
        run: node --input-type=module -e "import source from './scripts/model-source.json' with { type:'json' }; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_OUTPUT, 'archive=' + (source.pagesDelivery === 'archive') + '\n');"
      - name: Prepare a verified model archive outside the Pages size limit
        if: steps.delivery.outputs.archive == 'true'
        run: npm run model:archive
      - name: Publish the model archive for one-time local import
        if: steps.delivery.outputs.archive == 'true'
        run: node scripts/publish-model-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build for the repository path
        run: npm run build:pages
      - run: touch dist/.nojekyll
      - name: Check published site is within the GitHub Pages size limit
        run: node scripts/check-pages-size.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
